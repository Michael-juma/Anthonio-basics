<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anthonio basics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!--creation of the body and headings-->
<h1 class="text-center text-bold">Anthonio basics</h1>
<h2 class="text-right">Welcome to Anthonio basics</h2>
<h3 class="text-left">This is a simple HTML page</h3>

<p class="text-center">This is a paragraph in the center of the page.</p>
<img class="img-fluid rounded-circle" src="https://images.pexels.com/photos/33646928/pexels-photo-33646928.jpeg" style="width: 150px; height: 150px;" alt="woman by galata bridge">
<button class="btn btn-primary">Click Me</button>
<form action="/submit form" method="post">
    <input type="text" class="form-control" placeholder="Enter text here">
    <input type="submit" class="btn btn-success" value="Submit">
    <button class="btn btn-danger" type="update">update</button>
</form>
<form action="/delete" method="post">
    <input type="submit" placeholder="Delete" class="btn btn-danger" value="Delete">
</form>
<form action="/reset" method="post">
    <input type="submit" placeholder="Reset" class="btn btn-warning" value="Reset">
</form>

<script src="main.js"></script>
</body>
</html>
